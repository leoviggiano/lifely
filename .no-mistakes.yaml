# .no-mistakes.yaml — house defaults (v2 · 2026-08-13)
# Fonte canônica: ~/projects/artifacts/templates/no-mistakes-house.yaml
# Copie para a raiz do repo como .no-mistakes.yaml, ajuste commands.* aos alvos
# reais do repo e COMMITE — os campos de segurança valem só da default branch.
#
# v2: auto-fix DESLIGADO por decisão da casa (2.5.10) — o portão detecta e
# classifica; quem corrige é o executor na sessão ject, com contexto, e o
# conserto volta num re-push. Fix do agente frio do gate é commit sem sessão.
agent: claude

no_ci: true                     # derivado do repo: nao ha workflow de CI aqui (18-08-2026)
                                # exists => false. If underivable, false is the safe side: a
                                # gate expecting missing CI fails loudly; one ignoring real CI
                                # fails silently (ject, 13-08: flag was false-from-birth as a
                                # copied default; CI caught what the local suite missed).
allow_repo_commands: false      # default, kept explicit: pushed branches can't inject commands
disable_project_settings: true  # gate agents must not inherit this repo's AGENTS.md identity

commands:
  # -trimpath is what makes the gate's test cache exist at all: every run is
  # carved into a NEW worktree, and without the flag the test binary embeds
  # absolute paths -- new path = new cache key = a cold suite on every run.
  # VERIFIED IN THIS REPO on 18-08 (the flag breaks suites that locate fixtures
  # through runtime.Caller; ours uses t.TempDir()): `go test -trimpath ./...`
  # green.
  test: "go test -trimpath ./..."
  # -trimpath here too, and for the same reason -- but the cost only appears
  # AFTER test adopted it. go vet keys its action on the package build id, so
  # a vet without the flag no longer shares anything with a test that has it,
  # and pays a full cold build on every run.
  #
  # MEASURED in this repo, 19-08, fresh worktree, cache cleaned, after
  # `go test -trimpath ./...`:
  #   go vet ./...            5,94s   (cold: its own namespace, nothing warms it)
  #   go vet -trimpath ./...  1,46s   (shares the build test just did)
  # 4,1x. FALSIFIER: if a later measurement in a fresh gate worktree shows
  # `-trimpath` no faster than without, this line goes back.
  lint: "go vet -trimpath ./..."
  format: "gofmt -w ."

auto_fix:                       # gate detects; ject fixes (house decision, 2.5.10)
  rebase: 0
  review: 0
  test: 0
  document: 0
  lint: 0
  ci: 0
